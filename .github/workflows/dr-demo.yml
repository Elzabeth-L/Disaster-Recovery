name: Execute DR failover or failback demo

on:
  workflow_dispatch:
    inputs:
      action:
        description: Failover activates Singapore; failback restores Mumbai
        required: true
        type: choice
        options: [Failover, Failback]
      confirmation:
        description: Type DEMONSTRATE_DR
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  confirmation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate typed confirmation
        run: test '${{ inputs.confirmation }}' = DEMONSTRATE_DR

  eks:
    name: EKS controlled DNS cutover
    needs: confirmation
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Configure EKS DR credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-eks-${{ github.run_id }}

      - name: Validate DR EKS and switch DNS
        shell: bash
        run: |
          zone_id="$(aws route53 list-hosted-zones-by-name --dns-name dr.vaultrix.in --query 'HostedZones[?Name==`dr.vaultrix.in.`].Id | [0]' --output text)"
          dr_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks-dr.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
          [[ -n "${dr_target}" && "${dr_target}" != None ]]
          curl --fail --retry 12 --retry-delay 5 -H 'Host: eks.dr.vaultrix.in' "http://${dr_target}/healthz"

          if [[ '${{ inputs.action }}' == Failover ]]; then
            primary_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
            [[ -n "${primary_target}" && "${primary_target}" != None ]]
            change="$(jq -cn --arg primary "${primary_target}" --arg dr "${dr_target}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks-primary.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$primary}]}},{Action:"UPSERT",ResourceRecordSet:{Name:"eks.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$dr}]}}]}')"
          else
            primary_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks-primary.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
            [[ -n "${primary_target}" && "${primary_target}" != None ]]
            change="$(jq -cn --arg primary "${primary_target}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$primary}]}}]}')"
          fi
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "${zone_id}" --change-batch "${change}" --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "${change_id}"
          curl --fail --retry 30 --retry-delay 5 http://eks.dr.vaultrix.in/healthz
          curl --fail http://eks.dr.vaultrix.in/api/notes

  ec2:
    name: EC2 automatic health-check failover
    needs: confirmation
    runs-on: ubuntu-latest
    environment: ec2-apply
    steps:
      - name: Configure DR EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-ec2-dr-${{ github.run_id }}

      - name: Validate DR EC2 before cutover
        run: |
          status="$(curl --fail --retry 12 --retry-delay 5 http://ec2-dr.dr.vaultrix.in/api/status)"
          test "$(jq -r .environment <<< "${status}")" = DR
          test "$(jq -r .database <<< "${status}")" = connected

      - name: Configure primary EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: dr-demo-ec2-primary-${{ github.run_id }}

      - name: Stop primary and prove automatic failover
        if: inputs.action == 'Failover'
        shell: bash
        run: |
          instance_id="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=vaultrix-dr-primary-ec2-instance' 'Name=instance-state-name,Values=running' --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          [[ -n "${instance_id}" && "${instance_id}" != None ]]
          aws ec2 stop-instances --instance-ids "${instance_id}" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "${instance_id}"
          for attempt in {1..60}; do
            status="$(curl --silent --max-time 10 http://ec2.dr.vaultrix.in/api/status || true)"
            [[ "$(jq -r '.environment // empty' <<< "${status:-{}}")" == DR ]] && break
            sleep 10
          done
          test "$(jq -r .environment <<< "${status}")" = DR
          test "$(jq -r .database <<< "${status}")" = connected

      - name: Start primary and prove automatic failback
        if: inputs.action == 'Failback'
        shell: bash
        run: |
          instance_id="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=vaultrix-dr-primary-ec2-instance' 'Name=instance-state-name,Values=stopped' --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          [[ -n "${instance_id}" && "${instance_id}" != None ]]
          aws ec2 start-instances --instance-ids "${instance_id}" >/dev/null
          aws ec2 wait instance-status-ok --instance-ids "${instance_id}"
          for attempt in {1..60}; do
            status="$(curl --silent --max-time 10 http://ec2.dr.vaultrix.in/api/status || true)"
            [[ "$(jq -r '.environment // empty' <<< "${status:-{}}")" == PRIMARY ]] && break
            sleep 10
          done
          test "$(jq -r .environment <<< "${status}")" = PRIMARY
          test "$(jq -r .database <<< "${status}")" = connected
