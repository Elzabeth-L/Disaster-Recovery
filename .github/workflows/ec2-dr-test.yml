name: EC2 Disaster Recovery Automated Drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0' # Run weekly on Sunday at 04:00 UTC

permissions:
  id-token: write
  contents: read

env:
  PRIMARY_REGION: ap-south-1
  DR_REGION: ap-southeast-1
  ROLE_TO_ASSUME: arn:aws:iam::598120810297:role/vaultrix-dr-github-ec2-plan

jobs:
  dr-drill-verification:
    name: Verify Primary and DR Standby Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Auth to Primary Region and check Primary ALB health
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials for Primary Region
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.PRIMARY_REGION }}
          role-session-name: GitHubActions-EC2-DR-Drill-Primary

      - name: Check Primary EC2 Application Target Health
        run: |
          echo "============================================================"
          echo " Running EC2 DR Drill Check: Primary Region (${PRIMARY_REGION})"
          echo "============================================================"
          PRIMARY_ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region "${PRIMARY_REGION}" \
            --names "vaultrix-dr-primary-ec2-alb" \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [ -n "$PRIMARY_ALB_DNS" ] && [ "$PRIMARY_ALB_DNS" != "None" ]; then
            echo "Primary ALB DNS: $PRIMARY_ALB_DNS"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${PRIMARY_ALB_DNS}/health" || echo "000")
            echo "Primary /health HTTP Status: ${HTTP_CODE}"
            if [ "${HTTP_CODE}" == "200" ]; then
              echo "PASS: Primary application is healthy."
            else
              echo "FAIL: Primary /health did not return 200 (got ${HTTP_CODE})."
            fi
          else
            echo "INFO: Primary ALB not currently provisioned in ${PRIMARY_REGION}."
          fi

      # -----------------------------------------------------------------------
      # Step 2: Re-auth to DR Region and check DR ALB health
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials for DR Region
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.DR_REGION }}
          role-session-name: GitHubActions-EC2-DR-Drill-DR

      - name: Check DR Standby EC2 Application Target Health
        run: |
          echo "============================================================"
          echo " Running EC2 DR Drill Check: DR Region (${DR_REGION})"
          echo "============================================================"
          DR_ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region "${DR_REGION}" \
            --names "vaultrix-dr-dr-ec2-alb" \
            --query "LoadBalancers[0].DNSName" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DR_ALB_DNS" ] && [ "$DR_ALB_DNS" != "None" ]; then
            echo "DR ALB DNS: $DR_ALB_DNS"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${DR_ALB_DNS}/health" || echo "000")
            echo "DR /health HTTP Status: ${HTTP_CODE}"
            if [ "${HTTP_CODE}" == "200" ]; then
              echo "PASS: DR standby application is healthy."
            else
              echo "FAIL: DR /health did not return 200 (got ${HTTP_CODE})."
            fi
          else
            echo "INFO: DR ALB not currently provisioned in ${DR_REGION}."
          fi

      # -----------------------------------------------------------------------
      # Step 3: Re-auth to Primary to check Route 53 health check status
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials for Route 53 Check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.PRIMARY_REGION }}
          role-session-name: GitHubActions-EC2-DR-Drill-R53

      - name: Check Route 53 Failover Record Health
        run: |
          echo "============================================================"
          echo " Checking Route 53 Failover Health Checks"
          echo "============================================================"
          ZONE_ID=$(aws route53 list-hosted-zones-by-name \
            --dns-name "dr.vaultrix.in" \
            --query "HostedZones[0].Id" \
            --output text 2>/dev/null | sed 's#/hostedzone/##' || echo "")

          if [ -n "${ZONE_ID}" ] && [ "${ZONE_ID}" != "None" ]; then
            echo "Hosted Zone: ${ZONE_ID}"
            aws route53 list-resource-record-sets \
              --hosted-zone-id "${ZONE_ID}" \
              --query "ResourceRecordSets[?Name=='ec2.dr.vaultrix.in.'].[SetIdentifier, Failover, HealthCheckId]" \
              --output table 2>/dev/null || echo "No failover records found yet."
          else
            echo "INFO: Route 53 hosted zone for dr.vaultrix.in not found."
          fi
