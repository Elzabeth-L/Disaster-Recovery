name: EKS application CI

on:
  pull_request:
    branches: [main]
    paths:
      - "applications/eks-app/**"
      - "kubernetes/**"
      - ".github/workflows/eks-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: applications/eks-app/requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement applications/eks-app/requirements-dev.txt

      - name: Run application tests
        working-directory: applications/eks-app
        run: python -m pytest -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ARM64 image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: applications/eks-app
          platforms: linux/arm64
          push: false
          tags: notes-app:ci

      - name: Render primary manifests
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Substitute CI image tag
        shell: bash
        run: sed -i "s|newTag: replace-me|newTag: ci-${GITHUB_SHA}|" kubernetes/overlays/primary/kustomization.yaml

      - run: kubectl kustomize kubernetes/overlays/primary > "${RUNNER_TEMP}/primary.yaml"
        shell: bash

      - name: Reject unrendered application image
        run: |
          if grep -q ':replace-me' "${RUNNER_TEMP}/primary.yaml"; then
            echo "The primary manifest still contains an undeployable image tag." >&2
            exit 1
          fi
