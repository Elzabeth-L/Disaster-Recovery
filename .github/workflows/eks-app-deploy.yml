name: Deploy primary EKS notes application

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure short-lived deployment credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PRIMARY_REGION }}
          role-session-name: phase7a-app-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable ARM64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: applications/eks-app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/vaultrix-dr-notes:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Connect to primary cluster
        run: aws eks update-kubeconfig --name vaultrix-dr-primary-eks --region ap-south-1

      - name: Install AWS Load Balancer Controller
        shell: bash
        run: |
          vpc_id="$(aws eks describe-cluster --name vaultrix-dr-primary-eks --query 'cluster.resourcesVpcConfig.vpcId' --output text)"
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 3.3.0 \
            --set clusterName=vaultrix-dr-primary-eks \
            --set region=ap-south-1 \
            --set vpcId="${vpc_id}" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.create=true \
            --wait --timeout 10m

      - name: Create database credentials when absent
        shell: bash
        run: |
          set +x
          secret_id="vaultrix-dr-primary-eks/notes/database"
          if ! secret_json="$(aws secretsmanager get-secret-value --secret-id "${secret_id}" --query SecretString --output text 2>/dev/null)" || [[ -z "${secret_json}" ]]; then
            password="$(openssl rand -base64 32 | tr -d '\n')"
            secret_json="$(jq -cn --arg database notes --arg username notes --arg password "${password}" \
              '{database:$database,username:$username,password:$password}')"
            aws secretsmanager put-secret-value --secret-id "${secret_id}" --secret-string "${secret_json}" >/dev/null
          fi
          database="$(jq -r .database <<< "${secret_json}")"
          username="$(jq -r .username <<< "${secret_json}")"
          password="$(jq -r .password <<< "${secret_json}")"
          encoded_password="$(jq -rn --arg value "${password}" '$value|@uri')"
          kubectl create namespace notes --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n notes create secret generic notes-database \
            --from-literal="database=${database}" \
            --from-literal="username=${username}" \
            --from-literal="password=${password}" \
            --from-literal="url=postgresql://${username}:${encoded_password}@postgres:5432/${database}" \
            --dry-run=client -o yaml | kubectl apply -f -
          unset password encoded_password secret_json

      - name: Deploy image by digest
        shell: bash
        run: |
          repository="${{ steps.ecr.outputs.registry }}/vaultrix-dr-notes"
          digest="$(aws ecr describe-images --repository-name vaultrix-dr-notes \
            --image-ids imageTag=${GITHUB_SHA} --query 'imageDetails[0].imageDigest' --output text)"
          sed -i "s|newTag: replace-me|digest: ${digest}|" kubernetes/overlays/primary/kustomization.yaml
          kubectl apply -k kubernetes/overlays/primary
          kubectl -n notes rollout status statefulset/postgres --timeout=10m
          kubectl -n notes rollout status deployment/notes --timeout=10m

      - name: Verify ALB and publish DNS only after health
        shell: bash
        run: |
          for attempt in {1..60}; do
            alb="$(kubectl -n notes get ingress notes -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            [[ -n "${alb}" ]] && break
            sleep 10
          done
          [[ -n "${alb}" ]]
          curl --fail --retry 12 --retry-delay 10 -H 'Host: eks.dr.vaultrix.in' "http://${alb}/healthz"
          zone_id="$(aws route53 list-hosted-zones-by-name --dns-name dr.vaultrix.in \
            --query 'HostedZones[?Name==`dr.vaultrix.in.`].Id | [0]' --output text)"
          change="$(jq -cn --arg target "${alb}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$target}]}}]}')"
          aws route53 change-resource-record-sets --hosted-zone-id "${zone_id}" --change-batch "${change}" >/dev/null
          curl --fail --retry 12 --retry-delay 10 http://eks.dr.vaultrix.in/healthz
