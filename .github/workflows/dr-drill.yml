name: DR 2 - Drill

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Application preparation, traffic cutover, or application cleanup
        required: true
        type: choice
        options:
          - Deploy or refresh DR applications
          - Failover to DR
          - Failback to primary
          - Remove DR applications
      confirmation:
        description: Use DEMONSTRATE_DR for failover/failback or CLEANUP_DR_APPS for removal
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-eks:
    name: Deploy and seed DR EKS notes
    if: inputs.operation == 'Deploy or refresh DR applications'
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Capture primary notes snapshot
        run: |
          curl --fail --retry 6 --retry-delay 5 http://eks.dr.vaultrix.in/api/notes -o "${RUNNER_TEMP}/notes.json"
          jq -e 'type == "array"' "${RUNNER_TEMP}/notes.json"
          echo "Captured $(jq length "${RUNNER_TEMP}/notes.json") primary notes."

      - name: Configure primary EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: dr-app-primary-image-${{ github.run_id }}

      - name: Discover primary image digest
        id: image
        shell: bash
        run: |
          aws eks update-kubeconfig --name vaultrix-dr-primary-eks --region ap-south-1
          image="$(kubectl -n notes get deployment notes -o jsonpath='{.spec.template.spec.containers[0].image}')"
          digest="${image##*@}"
          [[ "${digest}" == sha256:* ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Configure DR EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-eks-${{ github.run_id }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Connect to DR cluster and install load balancer controller
        shell: bash
        run: |
          aws eks update-kubeconfig --name vaultrix-dr-dr-eks --region ap-southeast-1
          vpc_id="$(aws eks describe-cluster --name vaultrix-dr-dr-eks --query 'cluster.resourcesVpcConfig.vpcId' --output text)"
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system --version 3.3.0 \
            --set clusterName=vaultrix-dr-dr-eks \
            --set region=ap-southeast-1 \
            --set vpcId="${vpc_id}" \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.create=true \
            --wait --timeout 10m

      - name: Create DR database credentials
        shell: bash
        run: |
          set +x
          secret_id="vaultrix-dr-dr-eks/notes/database"
          if ! secret_json="$(aws secretsmanager get-secret-value --secret-id "${secret_id}" --query SecretString --output text 2>/dev/null)" || [[ -z "${secret_json}" ]]; then
            password="$(openssl rand -base64 32 | tr -d '\n')"
            secret_json="$(jq -cn --arg database notes --arg username notes --arg password "${password}" '{database:$database,username:$username,password:$password}')"
            aws secretsmanager put-secret-value --secret-id "${secret_id}" --secret-string "${secret_json}" >/dev/null
          fi
          database="$(jq -r .database <<< "${secret_json}")"
          username="$(jq -r .username <<< "${secret_json}")"
          password="$(jq -r .password <<< "${secret_json}")"
          encoded_password="$(jq -rn --arg value "${password}" '$value|@uri')"
          kubectl create namespace notes --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n notes create secret generic notes-database \
            --from-literal="database=${database}" --from-literal="username=${username}" \
            --from-literal="password=${password}" \
            --from-literal="url=postgresql://${username}:${encoded_password}@postgres:5432/${database}" \
            --dry-run=client -o yaml | kubectl apply -f -
          unset password encoded_password secret_json

      - name: Deploy immutable image and wait for DR ALB
        id: alb
        shell: bash
        run: |
          sed -i "s|newTag: replace-me|digest: ${{ steps.image.outputs.digest }}|" kubernetes/overlays/dr/kustomization.yaml
          kubectl apply -k kubernetes/overlays/dr
          kubectl -n notes rollout status statefulset/postgres --timeout=10m
          kubectl -n notes rollout status deployment/notes --timeout=10m
          for attempt in {1..60}; do
            alb="$(kubectl -n notes get ingress notes -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            [[ -n "${alb}" ]] && break
            sleep 10
          done
          [[ -n "${alb}" ]]
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors \
            -H 'Host: eks.dr.vaultrix.in' "http://${alb}/healthz"
          echo "hostname=${alb}" >> "${GITHUB_OUTPUT}"

      - name: Seed notes snapshot and publish diagnostic DNS
        shell: bash
        run: |
          alb="${{ steps.alb.outputs.hostname }}"
          curl --fail -H 'Host: eks.dr.vaultrix.in' "http://${alb}/api/notes" | jq -r '.[].id' | while read -r id; do
            curl --fail -X DELETE -H 'Host: eks.dr.vaultrix.in' "http://${alb}/api/notes/${id}"
          done
          jq -c '.[] | {title,content}' "${RUNNER_TEMP}/notes.json" | while read -r note; do
            curl --fail -H 'Host: eks.dr.vaultrix.in' -H 'Content-Type: application/json' \
              --data "${note}" "http://${alb}/api/notes" >/dev/null
          done
          zone_id="$(aws route53 list-hosted-zones-by-name --dns-name dr.vaultrix.in --query 'HostedZones[?Name==`dr.vaultrix.in.`].Id | [0]' --output text)"
          change="$(jq -cn --arg target "${alb}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks-dr.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$target}]}}]}')"
          aws route53 change-resource-record-sets --hosted-zone-id "${zone_id}" --change-batch "${change}" >/dev/null
          curl --fail --retry 12 --retry-delay 10 -H 'Host: eks.dr.vaultrix.in' "http://${alb}/api/notes"

  deploy-ec2:
    name: Seed and validate DR EC2 tasks
    if: inputs.operation == 'Deploy or refresh DR applications'
    runs-on: ubuntu-latest
    environment: ec2-apply
    steps:
      - name: Capture primary tasks snapshot
        run: |
          curl --fail --retry 6 --retry-delay 5 http://ec2.dr.vaultrix.in/api/tasks -o "${RUNNER_TEMP}/tasks.json"
          jq -e 'type == "array"' "${RUNNER_TEMP}/tasks.json"
          echo "Captured $(jq length "${RUNNER_TEMP}/tasks.json") primary tasks."

      - name: Configure DR EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-ec2-${{ github.run_id }}

      - name: Wait for DR application and seed tasks
        shell: bash
        run: |
          alb="$(aws elbv2 describe-load-balancers --names vaultrix-dr-dr-ec2-alb --query 'LoadBalancers[0].DNSName' --output text)"
          curl --fail --retry 30 --retry-delay 10 "http://${alb}/health"
          for attempt in {1..30}; do
            status="$(curl --fail --silent "http://${alb}/api/status")"
            [[ "$(jq -r .database <<< "${status}")" == connected ]] && break
            sleep 10
          done
          [[ "$(jq -r .database <<< "${status}")" == connected ]]
          curl --fail "http://${alb}/api/tasks" | jq -r '.[].id' | while read -r id; do
            curl --fail -X DELETE "http://${alb}/api/tasks/${id}" >/dev/null
          done
          jq -c '.[] | {title,description,priority}' "${RUNNER_TEMP}/tasks.json" | while read -r task; do
            curl --fail -H 'Content-Type: application/json' --data "${task}" "http://${alb}/api/tasks" >/dev/null
          done
          curl --fail "http://${alb}/api/tasks"

  confirm-cutover:
    name: Validate failover or failback confirmation
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    runs-on: ubuntu-latest
    steps:
      - name: Validate typed confirmation
        run: test '${{ inputs.confirmation }}' = DEMONSTRATE_DR

  cutover-eks:
    name: EKS controlled DNS cutover
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    needs: confirm-cutover
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Configure EKS DR credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-eks-${{ github.run_id }}

      - name: Validate DR EKS and switch DNS
        shell: bash
        run: |
          zone_id="$(aws route53 list-hosted-zones-by-name --dns-name dr.vaultrix.in --query 'HostedZones[?Name==`dr.vaultrix.in.`].Id | [0]' --output text)"
          dr_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks-dr.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
          [[ -n "${dr_target}" && "${dr_target}" != None ]]
          curl --fail --retry 12 --retry-delay 5 -H 'Host: eks.dr.vaultrix.in' "http://${dr_target}/healthz"

          if [[ '${{ inputs.operation }}' == 'Failover to DR' ]]; then
            primary_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
            [[ -n "${primary_target}" && "${primary_target}" != None ]]
            change="$(jq -cn --arg primary "${primary_target}" --arg dr "${dr_target}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks-primary.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$primary}]}},{Action:"UPSERT",ResourceRecordSet:{Name:"eks.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$dr}]}}]}')"
          else
            primary_target="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query 'ResourceRecordSets[?Name==`eks-primary.dr.vaultrix.in.`].ResourceRecords[0].Value | [0]' --output text)"
            [[ -n "${primary_target}" && "${primary_target}" != None ]]
            change="$(jq -cn --arg primary "${primary_target}" '{Changes:[{Action:"UPSERT",ResourceRecordSet:{Name:"eks.dr.vaultrix.in",Type:"CNAME",TTL:60,ResourceRecords:[{Value:$primary}]}}]}')"
          fi
          change_id="$(aws route53 change-resource-record-sets --hosted-zone-id "${zone_id}" --change-batch "${change}" --query ChangeInfo.Id --output text)"
          aws route53 wait resource-record-sets-changed --id "${change_id}"
          curl --fail --retry 30 --retry-delay 5 http://eks.dr.vaultrix.in/healthz
          curl --fail http://eks.dr.vaultrix.in/api/notes

  cutover-ec2:
    name: EC2 automatic health-check cutover
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    needs: confirm-cutover
    runs-on: ubuntu-latest
    environment: ec2-apply
    steps:
      - name: Configure DR EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-ec2-dr-${{ github.run_id }}

      - name: Validate DR EC2 before cutover
        run: |
          status="$(curl --fail --retry 12 --retry-delay 5 http://ec2-dr.dr.vaultrix.in/api/status)"
          test "$(jq -r .environment <<< "${status}")" = DR
          test "$(jq -r .database <<< "${status}")" = connected

      - name: Configure primary EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: dr-demo-ec2-primary-${{ github.run_id }}

      - name: Stop primary and prove automatic failover
        if: inputs.operation == 'Failover to DR'
        shell: bash
        run: |
          instance_id="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=vaultrix-dr-primary-ec2-instance' 'Name=instance-state-name,Values=running' --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          [[ -n "${instance_id}" && "${instance_id}" != None ]]
          aws ec2 stop-instances --instance-ids "${instance_id}" >/dev/null
          aws ec2 wait instance-stopped --instance-ids "${instance_id}"
          for attempt in {1..60}; do
            status="$(curl --silent --max-time 10 http://ec2.dr.vaultrix.in/api/status || true)"
            [[ "$(jq -r '.environment // empty' <<< "${status:-{}}")" == DR ]] && break
            sleep 10
          done
          test "$(jq -r .environment <<< "${status}")" = DR
          test "$(jq -r .database <<< "${status}")" = connected

      - name: Start primary and prove automatic failback
        if: inputs.operation == 'Failback to primary'
        shell: bash
        run: |
          instance_id="$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=vaultrix-dr-primary-ec2-instance' 'Name=instance-state-name,Values=stopped' --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          [[ -n "${instance_id}" && "${instance_id}" != None ]]
          aws ec2 start-instances --instance-ids "${instance_id}" >/dev/null
          aws ec2 wait instance-status-ok --instance-ids "${instance_id}"
          for attempt in {1..60}; do
            status="$(curl --silent --max-time 10 http://ec2.dr.vaultrix.in/api/status || true)"
            [[ "$(jq -r '.environment // empty' <<< "${status:-{}}")" == PRIMARY ]] && break
            sleep 10
          done
          test "$(jq -r .environment <<< "${status}")" = PRIMARY
          test "$(jq -r .database <<< "${status}")" = connected

  cleanup-eks:
    name: Remove DR EKS application resources
    if: inputs.operation == 'Remove DR applications'
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Validate confirmation
        run: test '${{ inputs.confirmation }}' = CLEANUP_DR_APPS

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Configure DR EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-cleanup-${{ github.run_id }}

      - name: Remove Kubernetes workload and ALB
        shell: bash
        run: |
          aws eks update-kubeconfig --name vaultrix-dr-dr-eks --region ap-southeast-1
          kubectl get pv -o json | jq -r '.items[] | select(.spec.claimRef.namespace == "notes") | .metadata.name' | while read -r pv; do
            kubectl patch pv "${pv}" -p '{"spec":{"persistentVolumeReclaimPolicy":"Delete"}}'
          done
          kubectl delete -k kubernetes/overlays/dr --ignore-not-found --wait=true
          helm uninstall aws-load-balancer-controller --namespace kube-system || true

      - name: Remove diagnostic EKS DNS records
        shell: bash
        run: |
          zone_id="$(aws route53 list-hosted-zones-by-name --dns-name dr.vaultrix.in --query 'HostedZones[?Name==`dr.vaultrix.in.`].Id | [0]' --output text)"
          for name in eks-dr.dr.vaultrix.in. eks-primary.dr.vaultrix.in.; do
            record="$(aws route53 list-resource-record-sets --hosted-zone-id "${zone_id}" --query "ResourceRecordSets[?Name=='${name}' && Type=='CNAME'] | [0]" --output json)"
            [[ "${record}" == null ]] && continue
            batch="$(jq -cn --argjson record "${record}" '{Changes:[{Action:"DELETE",ResourceRecordSet:$record}]}')"
            aws route53 change-resource-record-sets --hosted-zone-id "${zone_id}" --change-batch "${batch}" >/dev/null
          done
