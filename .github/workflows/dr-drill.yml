name: DR 2 - Drill

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Application preparation, traffic cutover, or application cleanup
        required: true
        type: choice
        options:
          - Deploy or refresh DR applications
          - Failover to DR
          - Failback to primary
          - Remove DR applications
      confirmation:
        description: Use DEMONSTRATE_DR for failover/failback or CLEANUP_DR_APPS for removal
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-eks:
    name: Deploy and seed DR EKS notes
    if: inputs.operation == 'Deploy or refresh DR applications'
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Capture primary notes snapshot
        run: bash .github/scripts/dr-drill.sh capture-eks-snapshot

      - name: Configure primary EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: dr-app-primary-image-${{ github.run_id }}

      - name: Discover primary image digest
        id: image
        run: bash .github/scripts/dr-drill.sh discover-primary-image

      - name: Configure DR EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-eks-${{ github.run_id }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Connect to DR cluster and install load balancer controller
        run: bash .github/scripts/dr-drill.sh install-load-balancer-controller

      - name: Create DR database credentials
        run: bash .github/scripts/dr-drill.sh create-eks-database-secret

      - name: Deploy immutable image and wait for DR ALB
        id: alb
        run: bash .github/scripts/dr-drill.sh deploy-eks '${{ steps.image.outputs.digest }}'

      - name: Seed notes snapshot and publish diagnostic DNS
        run: bash .github/scripts/dr-drill.sh seed-eks '${{ steps.alb.outputs.hostname }}'

  deploy-ec2:
    name: Seed and validate DR EC2 tasks
    if: inputs.operation == 'Deploy or refresh DR applications'
    runs-on: ubuntu-latest
    environment: ec2-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Capture primary tasks snapshot
        run: bash .github/scripts/dr-drill.sh capture-ec2-snapshot

      - name: Configure DR EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-ec2-${{ github.run_id }}

      - name: Wait for DR application and seed tasks
        run: bash .github/scripts/dr-drill.sh seed-ec2

  confirm-cutover:
    name: Validate failover or failback confirmation
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    runs-on: ubuntu-latest
    steps:
      - name: Validate typed confirmation
        run: test '${{ inputs.confirmation }}' = DEMONSTRATE_DR

  cutover-eks:
    name: EKS controlled DNS cutover
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    needs: confirm-cutover
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure EKS DR credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-eks-${{ github.run_id }}

      - name: Validate DR EKS and switch DNS
        run: bash .github/scripts/dr-drill.sh cutover-eks '${{ inputs.operation }}'

  cutover-ec2:
    name: EC2 automatic health-check cutover
    if: inputs.operation == 'Failover to DR' || inputs.operation == 'Failback to primary'
    needs: confirm-cutover
    runs-on: ubuntu-latest
    environment: ec2-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure DR EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-demo-ec2-dr-${{ github.run_id }}

      - name: Validate DR EC2 before cutover
        run: bash .github/scripts/dr-drill.sh validate-dr-ec2

      - name: Configure primary EC2 credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EC2_APPLY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: dr-demo-ec2-primary-${{ github.run_id }}

      - name: Stop primary and prove automatic failover
        if: inputs.operation == 'Failover to DR'
        run: bash .github/scripts/dr-drill.sh cutover-ec2 'Failover to DR'

      - name: Start primary and prove automatic failback
        if: inputs.operation == 'Failback to primary'
        run: bash .github/scripts/dr-drill.sh cutover-ec2 'Failback to primary'

  cleanup-eks:
    name: Remove DR EKS application resources
    if: inputs.operation == 'Remove DR applications'
    runs-on: ubuntu-latest
    environment: eks-apply
    steps:
      - name: Validate confirmation
        run: test '${{ inputs.confirmation }}' = CLEANUP_DR_APPS

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Configure DR EKS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_EKS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: dr-app-cleanup-${{ github.run_id }}

      - name: Remove Kubernetes workload and ALB
        run: bash .github/scripts/dr-drill.sh cleanup-eks-workload

      - name: Remove diagnostic EKS DNS records
        run: bash .github/scripts/dr-drill.sh cleanup-eks-dns
